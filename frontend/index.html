<!doctype html>
<html lang="uz">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>FaceReg — Kirish</title>
    <style>
      :root {
        color-scheme: light;
        --bg: #f3f5f8;
        --bg-elevated: #ffffff;
        --border: #e3e7ed;
        --border-strong: #d5dae2;
        --text: #172033;
        --text-dim: #737d8c;
        --accent: #315efb;
        --danger: #dc3545;
      }

      * { box-sizing: border-box; }

      html, body {
        height: 100%;
        margin: 0;
        background: var(--bg);
        color: var(--text);
        font-family: -apple-system, "Segoe UI", Roboto, sans-serif;
      }

      body { min-width: 320px; }
      button, input { font: inherit; }

      .auth-page {
        width: 100vw;
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 24px;
      }

      .auth-card {
        width: min(100%, 420px);
        display: flex;
        flex-direction: column;
        gap: 20px;
        padding: 36px;
        border: 1px solid var(--border);
        border-radius: 20px;
        background: var(--bg-elevated);
        box-shadow: 0 18px 50px rgba(28, 39, 60, 0.1);
      }

      .auth-logo {
        width: 72px;
        height: 72px;
        align-self: center;
        border-radius: 18px;
        object-fit: cover;
      }

      .auth-heading { text-align: center; }
      .auth-heading h1 { margin: 0 0 8px; font-size: 1.8rem; }
      .auth-heading p { margin: 0; color: var(--text-dim); line-height: 1.5; }

      .auth-field {
        display: flex;
        flex-direction: column;
        gap: 8px;
        color: #3e4756;
        font-size: 0.9rem;
        font-weight: 600;
      }

      .auth-field input {
        width: 100%;
        padding: 13px 14px;
        border: 1px solid var(--border-strong);
        border-radius: 10px;
        outline: none;
        background: #fff;
        color: var(--text);
        transition: border-color 150ms, box-shadow 150ms;
      }

      .auth-field input:focus {
        border-color: var(--accent);
        box-shadow: 0 0 0 3px rgba(91, 140, 255, 0.15);
      }

      .auth-error {
        display: none;
        margin: -6px 0 0;
        color: var(--danger);
        font-size: 0.9rem;
      }

      .auth-error.visible { display: block; }

      .response-details {
        display: none;
        margin-top: -8px;
        border: 1px solid var(--border);
        border-radius: 10px;
        background: #f8fafc;
      }
      .response-details.visible { display: block; }
      .response-details summary {
        padding: 10px 12px;
        cursor: pointer;
        color: #3e4756;
        font-size: 0.85rem;
        font-weight: 700;
      }
      .response-details pre {
        max-height: 220px;
        margin: 0;
        padding: 0 12px 12px;
        overflow: auto;
        color: #334155;
        font: 12px/1.5 ui-monospace, SFMono-Regular, Menlo, monospace;
        white-space: pre-wrap;
        word-break: break-word;
      }

      .auth-submit {
        min-height: 46px;
        border: 0;
        border-radius: 10px;
        background: var(--accent);
        color: #fff;
        cursor: pointer;
        font-weight: 700;
      }

      .auth-submit:disabled { cursor: not-allowed; opacity: 0.65; }

      .blocked-card { width: min(100%, 560px); }
      .blocked-card[hidden], .auth-card[hidden] { display: none; }
      .blocked-title { margin: 0; font-size: 28px; line-height: 36px; }
      .store-badge {
        margin: -8px 0 0;
        color: #f58220;
        font-size: 14px;
        line-height: 20px;
        font-weight: 700;
      }
      .blocked-message {
        margin: 0;
        color: var(--text-dim);
        font-size: 16px;
        line-height: 24px;
        white-space: pre-line;
      }

      @media (max-width: 520px) {
        .auth-card { padding: 28px 22px; }
      }
    </style>
  </head>
  <body>
    <main class="auth-page">
      <form class="auth-card" id="login-form">
        <img
          class="auth-logo"
          src="https://face-reg-cyan.vercel.app/models/Pharma_scanner_rounded.png"
          alt="FaceReg"
        />
        <div class="auth-heading">
          <h1>Tizimga kirish</h1>
          <p>Davom etish uchun telefon raqamingiz va parolingizni kiriting</p>
        </div>

        <label class="auth-field">
          <span>Telefon raqami</span>
          <input
            id="phone"
            type="tel"
            inputmode="numeric"
            autocomplete="tel"
            value="+998"
            placeholder="+998 90 123 45 67"
          />
        </label>

        <label class="auth-field">
          <span>Parol</span>
          <input
            id="password"
            type="password"
            autocomplete="current-password"
            placeholder="Parolingizni kiriting"
          />
        </label>

        <p class="auth-error" id="error" role="alert"></p>
        <details class="response-details" id="response-details" open>
          <summary>Server javobi</summary>
          <pre id="response-body"></pre>
        </details>
        <button class="auth-submit" id="submit" type="submit">Kirish</button>
      </form>

      <section class="auth-card blocked-card" id="blocked-card" hidden>
        <img
          class="auth-logo"
          src="https://face-reg-cyan.vercel.app/models/Pharma_scanner_rounded.png"
          alt="FaceReg"
        />
        <h1 class="blocked-title">Kirish bloklandi</h1>
        <p class="store-badge" id="blocked-store"></p>
        <p class="blocked-message" id="blocked-message"></p>
        <button class="auth-submit" id="back-to-login" type="button">
          Login sahifasiga qaytish
        </button>
      </section>
    </main>

    <script type="module" src="/main.js"></script>
  </body>
</html>
