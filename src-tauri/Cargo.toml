[package]
name = "face-reg-desktop"
version = "1.0.0"
description = "Lightweight FaceReg desktop WebView"
authors = ["JsDevUz"]
edition = "2021"

[lib]
name = "face_reg_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2.9.5", features = [] }
url = "2"

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
